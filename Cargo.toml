[package]
name = "png2webpd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap    = { version = "4.6.0", features = ["derive"] }
rayon   = "1.11.0"
png     = "0.18.1"
webp    = { version = "0.3.1", features = [] }
walkdir = "2.5.0"
image   = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
debug = true # flamegraph
